# Railway deployment config for Atlas (Hermes gateway as chief-of-staff agent).
# Use the project Dockerfile (not Nixpacks) and run the gateway daemon.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# NO startCommand — deliberately. The image runs the gateway via its baked
# CMD ["gateway", "run", "-v"] (see Dockerfile), routed by the upstream
# s6-overlay chain: /init → rc.init → main-wrapper.sh → `hermes gateway run -v`.
#
# History: the tini-era image needed startCommand = "/usr/bin/tini -g --
# /opt/hermes/docker/entrypoint.sh gateway run -v". When upstream switched
# the base image to s6-overlay (between v2026.5.16 and v2026.5.29), Railway's
# startCommand handling mangled the entrypoint vector and the container
# boot-looped on `rc.init: 91: -g: not found` — the June 7-10 2026 outage.
# Do not reintroduce startCommand; bake CMD changes into the Dockerfile.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Hermes gateway uses Slack Socket Mode (outbound WebSocket) — no HTTP listener
# needed. Railway will leave the service "deployed" without a public URL,
# which is correct for a Socket Mode agent.
healthcheckPath = ""
