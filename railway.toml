# Railway deployment config for Atlas (Hermes gateway as chief-of-staff agent).
# Use the project Dockerfile (not Nixpacks) and run the gateway daemon.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway's startCommand REPLACES the Docker ENTRYPOINT (not just CMD), which
# bypassed the entrypoint script that sources the venv. Result: `hermes` not on
# PATH → first deploy attempt died with "executable hermes could not be found".
#
# Invoke tini + entrypoint.sh explicitly, passing `gateway run` as args.
# The entrypoint sources /opt/hermes/.venv/bin/activate (which adds hermes to
# PATH) and then `exec hermes "$@"`. tini reaps MCP stdio subprocesses.
#
# `-v` raises stderr verbosity from WARNING to INFO. Without it, plugin
# discovery + Slack Socket Mode connect log records only land in the on-disk
# gateway.log inside the container — Railway captures stdout/stderr only, so
# the gateway looked stalled after the banner when it was actually fine.
startCommand = "/usr/bin/tini -g -- /opt/hermes/docker/entrypoint.sh gateway run -v"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Hermes gateway uses Slack Socket Mode (outbound WebSocket) — no HTTP listener
# needed. Railway will leave the service "deployed" without a public URL,
# which is correct for a Socket Mode agent.
healthcheckPath = ""
